<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보드게임 참조표 모음</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      max-width: 760px;
      margin: 32px auto;
      padding: 0 16px;
      background-color: #f1f5f9;
      color: #1e293b;
      line-height: 1.5;
    }
    .container {
      background: #ffffff;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid #e2e8f0;
    }
    .header {
      margin-bottom: 24px;
      border-bottom: 2px solid #0284c7;
      padding-bottom: 14px;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      color: #0f172a;
      margin: 0 0 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subtitle {
      font-size: 13.5px;
      color: #64748b;
      margin: 0;
    }

    /* 검색 컨트롤 영역 */
    .search-panel {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .search-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ref-select {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      color: #1e293b;
      outline: none;
      cursor: pointer;
      min-width: 170px;
      transition: all 0.2s;
    }
    .ref-select:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }
    .search-input-wrapper {
      position: relative;
      flex: 1;
      min-width: 220px;
      display: flex;
      align-items: center;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      font-size: 14px;
      color: #94a3b8;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 10px 36px 10px 36px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      font-family: inherit;
      font-size: 14px;
      color: #0f172a;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }
    .search-clear {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
      line-height: 1;
      display: none;
    }
    .search-clear:hover {
      color: #475569;
    }

    /* 추천 키워드 태그 */
    .quick-tags {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 12.5px;
    }
    .quick-label {
      font-weight: 700;
      color: #64748b;
      margin-right: 2px;
    }
    .chip {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 3px 9px;
      color: #334155;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .chip:hover {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0284c7;
      transform: translateY(-1px);
    }

    /* 섹션 공통 */
    .section-title {
      font-size: 16px;
      font-weight: 800;
      color: #334155;
      margin: 0 0 14px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .count-badge {
      font-size: 12px;
      font-weight: 600;
      color: #0284c7;
      background: #e0f2fe;
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* 기본 참조표 카드 목록 */
    .game-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: all 0.2s ease;
    }
    .game-card:hover {
      border-color: #0284c7;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.1);
    }
    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .game-title {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .game-title:hover {
      color: #0284c7;
    }
    .game-tags {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 11px;
      font-weight: 600;
      background: #f1f5f9;
      color: #475569;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
    }
    .tag.ver {
      background: #e0f2fe;
      color: #0369a1;
      border-color: #bae6fd;
    }
    .game-desc {
      font-size: 13.5px;
      color: #475569;
      margin: 0 0 14px 0;
    }
    .game-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
      flex-wrap: wrap;
    }
    .btn-view-all {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 7px 14px;
      background-color: #0284c7;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .btn-view-all:hover {
      background-color: #0369a1;
      transform: translateY(-1px);
    }
    .section-shortcuts {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .shortcut-chip {
      font-size: 11.5px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 3px 8px;
      border-radius: 5px;
      text-decoration: none;
      color: #334155;
      font-weight: 600;
      transition: all 0.15s;
    }
    .shortcut-chip:hover {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0284c7;
    }

    /* 검색 결과 영역 */
    .search-results-group {
      margin-bottom: 24px;
    }
    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #f1f5f9;
      border-left: 4px solid #0284c7;
      border-radius: 0 6px 6px 0;
      font-weight: 800;
      font-size: 14.5px;
      color: #0f172a;
      margin-bottom: 10px;
    }
    .result-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 8px;
      transition: all 0.2s ease;
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .result-card:hover {
      border-color: #0284c7;
      background: #f8fafc;
      transform: translateX(3px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .result-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .result-title {
      font-size: 14px;
      font-weight: 700;
      color: #1d4ed8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .result-cat {
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      background: #e2e8f0;
      color: #475569;
    }
    .result-snippet {
      font-size: 13px;
      color: #334155;
      line-height: 1.5;
      margin: 0 0 6px 0;
    }
    .result-link-text {
      font-size: 12px;
      font-weight: 700;
      color: #0284c7;
      text-align: right;
    }
    mark.kw-highlight {
      background-color: #fef08a;
      color: #854d0e;
      font-weight: 700;
      padding: 1px 3px;
      border-radius: 3px;
    }

    /* 빈 상태 */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px dashed #cbd5e1;
      color: #64748b;
    }
    .empty-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }
    .empty-text {
      font-size: 14.5px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 4px;
    }
    .empty-sub {
      font-size: 13px;
    }

    @media (max-width: 600px) {
      body { margin: 16px auto; }
      .container { padding: 20px 16px; }
      .search-row { flex-direction: column; }
      .ref-select { width: 100%; }
      .game-actions { flex-direction: column; align-items: stretch; }
      .btn-view-all { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎲 보드게임 참조표 모음</h1>
      <p class="subtitle">참조표별로 필요한 규칙, 액션, 용어를 쉽고 빠르게 검색하세요.</p>
    </div>

    <!-- 검색 및 필터 컨트롤 -->
    <div class="search-panel">
      <div class="search-row">
        <select id="refSelect" class="ref-select" title="검색 대상 참조표 선택">
          <option value="all">🌐 모든 참조표 검색</option>
          <!-- 참조표 옵션 동적 생성 -->
        </select>
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="규칙 또는 키워드 검색 (예: 발굴, 물 이동, 수정, 리콜...)" autocomplete="off">
          <button type="button" id="searchClear" class="search-clear" title="검색어 지우기">✕</button>
        </div>
      </div>

      <!-- 추천 빠른 검색어 -->
      <div class="quick-tags">
        <span class="quick-label">빠른 검색:</span>
        <span class="chip" data-query="키카드">키카드</span>
        <span class="chip" data-query="행동 상자">행동 상자</span>
        <span class="chip" data-query="리콜">리콜</span>
        <span class="chip" data-query="자유 행동">자유 행동</span>
        <span class="chip" data-query="크리스탈 교환">크리스탈 교환</span>
        <span class="chip" data-query="건설">건설</span>
        <span class="chip" data-query="발굴">발굴</span>
        <span class="chip" data-query="물 이동">물 이동</span>
        <span class="chip" data-query="유물 큐브">유물 큐브</span>
        <span class="chip" data-query="특별 라운드">특별 라운드</span>
      </div>
    </div>

    <!-- 검색 결과 및 기본 목록 컨테이너 -->
    <div id="contentArea"></div>
  </div>

  <script src="search-data.js"></script>
  <script>
    (function() {
      // DOM 요소
      const refSelect = document.getElementById('refSelect');
      const searchInput = document.getElementById('searchInput');
      const searchClear = document.getElementById('searchClear');
      const contentArea = document.getElementById('contentArea');
      const quickChips = document.querySelectorAll('.chip');

      // 참조표 데이터 확인 (외부 search-data.js)
      const books = (typeof REFERENCE_DATABASE !== 'undefined') ? REFERENCE_DATABASE : [];

      // 1. 셀렉트 박스 옵션 생성
      function populateSelect() {
        books.forEach(b => {
          const opt = document.createElement('option');
          opt.value = b.id;
          opt.textContent = `📖 ${b.title}`;
          refSelect.appendChild(opt);
        });
      }

      // 2. 키워드 하이라이트 함수 (안전한 HTML 이스케이프)
      function highlightKeywords(text, query) {
        if (!query) return escapeHtml(text);
        const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(${escapedQuery})`, 'gi');
        return escapeHtml(text).replace(regex, '<mark class="kw-highlight">$1</mark>');
      }

      function escapeHtml(str) {
        return (str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // 3. 기본 화면 (검색어 없을 때: 등록된 참조표 목록)
      function renderDefaultView() {
        const selectedId = refSelect.value;
        const filteredBooks = (selectedId === 'all') 
          ? books 
          : books.filter(b => b.id === selectedId);

        let html = `
          <div class="section-title">
            <span>📋 등록된 보드게임 참조표</span>
            <span class="count-badge">${filteredBooks.length}개 게임</span>
          </div>
        `;

        if (filteredBooks.length === 0) {
          html += `
            <div class="empty-state">
              <div class="empty-icon">📂</div>
              <div class="empty-text">선택된 참조표가 없습니다.</div>
            </div>
          `;
        } else {
          filteredBooks.forEach(b => {
            html += `
              <div class="game-card">
                <div class="game-header">
                  <a href="${b.file}" class="game-title">
                    <span>📖 ${escapeHtml(b.title)}</span>
                  </a>
                  <div class="game-tags">
                    <span class="tag ver">${escapeHtml(b.version)}</span>
                    ${b.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
                  </div>
                </div>
                <p class="game-desc">${escapeHtml(b.description)}</p>
                <div class="game-actions">
                  <div class="section-shortcuts">
                    <span style="font-size:11.5px; font-weight:700; color:#64748b; margin-right:2px;">목차 바로가기:</span>
                    ${b.sections.map(s => `
                      <a href="${b.file}#${s.id}" class="shortcut-chip" title="${escapeHtml(s.title)}">
                        ${escapeHtml(s.title.split(' ')[0] || s.title)}
                      </a>
                    `).join('')}
                  </div>
                  <a href="${b.file}" class="btn-view-all">참조표 열기 ↗</a>
                </div>
              </div>
            `;
          });
        }

        contentArea.innerHTML = html;
      }

      // 4. 검색 결과 화면 (검색어 입력 시)
      function renderSearchResults(query) {
        const selectedId = refSelect.value;
        const targetBooks = (selectedId === 'all') 
          ? books 
          : books.filter(b => b.id === selectedId);

        const qLower = query.toLowerCase().trim();
        const resultsByBook = [];
        let totalMatches = 0;

        targetBooks.forEach(b => {
          const matchingSections = [];

          b.sections.forEach(sec => {
            const inTitle = sec.title.toLowerCase().includes(qLower);
            const inContent = sec.content.toLowerCase().includes(qLower);
            const inKeywords = (sec.keywords || []).some(k => k.toLowerCase().includes(qLower));

            if (inTitle || inContent || inKeywords) {
              matchingSections.push(sec);
              totalMatches++;
            }
          });

          if (matchingSections.length > 0) {
            resultsByBook.push({
              book: b,
              sections: matchingSections
            });
          }
        });

        // 렌더링
        let html = `
          <div class="section-title">
            <span>🔍 "<strong>${escapeHtml(query)}</strong>" 검색 결과</span>
            <span class="count-badge">총 ${totalMatches}건</span>
          </div>
        `;

        if (totalMatches === 0) {
          html += `
            <div class="empty-state">
              <div class="empty-icon">🧐</div>
              <div class="empty-text">일치하는 규칙 또는 내용을 찾을 수 없습니다.</div>
              <div class="empty-sub">오타를 확인하시거나 상단의 추천 검색어 칩을 눌러보세요.</div>
            </div>
          `;
        } else {
          resultsByBook.forEach(group => {
            html += `
              <div class="search-results-group">
                <div class="group-header">
                  <span>📖 ${escapeHtml(group.book.title)}</span>
                  <span style="font-size:12px; font-weight:600; color:#0369a1;">${group.sections.length}개 섹션 일치</span>
                </div>
            `;

            group.sections.forEach(sec => {
              // 섹션 바로가기 링크 (검색어 q와 섹션 id 해시 전달)
              const linkUrl = `${group.book.file}?q=${encodeURIComponent(query)}#${sec.id}`;
              const highlightedTitle = highlightKeywords(sec.title, query);
              const highlightedContent = highlightKeywords(sec.content, query);

              html += `
                <a href="${linkUrl}" class="result-card">
                  <div class="result-card-header">
                    <span class="result-title">${highlightedTitle}</span>
                    <span class="result-cat">${escapeHtml(sec.category)}</span>
                  </div>
                  <div class="result-snippet">${highlightedContent}</div>
                  <div class="result-link-text">해당 규칙 바로보기 &rarr;</div>
                </a>
              `;
            });

            html += `</div>`;
          });
        }

        contentArea.innerHTML = html;
      }

      // 5. 검색 및 필터 이벤트 핸들러
      function handleUpdate() {
        const query = searchInput.value.trim();
        searchClear.style.display = searchInput.value ? 'block' : 'none';

        if (!query) {
          renderDefaultView();
        } else {
          renderSearchResults(query);
        }
      }

      searchInput.addEventListener('input', handleUpdate);
      refSelect.addEventListener('change', handleUpdate);

      searchClear.addEventListener('click', () => {
        searchInput.value = '';
        searchInput.focus();
        handleUpdate();
      });

      // 빠른 검색 칩 클릭
      quickChips.forEach(chip => {
        chip.addEventListener('click', () => {
          const q = chip.getAttribute('data-query');
          searchInput.value = q;
          searchInput.focus();
          handleUpdate();
        });
      });

      // Enter 누르면 첫 결과로 바로 이동
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const firstResult = contentArea.querySelector('.result-card');
          if (firstResult) {
            firstResult.click();
          }
        } else if (e.key === 'Escape') {
          searchInput.value = '';
          handleUpdate();
        }
      });

      // 초기화
      populateSelect();
      renderDefaultView();
    })();
  </script>
</body>
</html>
